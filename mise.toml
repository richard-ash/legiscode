[tools]
node = "24.15.0"
pnpm = "10.33.2"

[tasks."git:install-hooks"]
description = "Point this clone's core.hooksPath at .githooks/ so the commit-msg lint runs on every commit. Idempotent; run once per clone."
run = "git config core.hooksPath .githooks && echo 'core.hooksPath -> .githooks (commit-msg lint active)'"

[tasks."corpus:build"]
description = "Build a jurisdiction module from manifest input. Usage: mise run corpus:build -- --module sf-transportation --source manifests/sf-transportation/manifest.json --output build/modules/sf-transportation/"
run = "pnpm exec tsx scripts/sync-corpus.ts"

[tasks."modules:pack"]
description = "Pack built modules into downloadable archives and emit versioned catalog. Reads build/modules/, writes archives + index.json + catalog-<jd>.json to build/dist/."
run = "pnpm exec tsx scripts/pack-modules.ts"

[tasks."bills:fetch"]
description = "Lane-1 operator-driven scraper. Walks SF Legistar pending-legislation search, downloads latest Leg Ver{N} attachments, writes build/downloads/bills/bills-index.json. Non-hermetic; never runs in CI."
run = "pnpm exec tsx scripts/fetch-bills.ts --manifest manifests/sf/jurisdiction.json"

[tasks."bills:sync"]
description = "Lane-2 hermetic bill parser. Reads bills-index.json + cached PDFs, validates each emitted Bill against BillSchema, writes per-module pending-bill files, purges stale entries. Runs in CI against committed fixtures via the integration test."
run = "pnpm exec tsx scripts/sync-bills.ts --manifest manifests/sf/jurisdiction.json --bills-index build/downloads/bills/bills-index.json"

[tasks."validate:full"]
description = "Run buildCorpus against the committed SF manifest + production HTML snapshot. Operator-driven, NOT in CI. Requires build/downloads/sf.html (see docs/CORPUS-VALIDATION.md). Pass criteria: exit 0, skip rate 0%, TOC coverage 100%, intra-citation 100%."
run = """
rm -rf build/modules
pnpm exec tsx scripts/sync-corpus.ts \
  --source manifests/sf/jurisdiction.json \
  --output build/modules \
  --snapshot-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
"""

[tasks.typecheck]
description = "TypeScript typecheck (no emit) — renderer/lib via tsconfig.json + main/preload via tsconfig.electron.json"
run = """
pnpm exec tsc --noEmit
pnpm exec tsc -p tsconfig.electron.json --noEmit
"""
sources = ["src/**/*.ts", "src/**/*.tsx", "test/**/*.ts", "electron/**/*.ts", "tsconfig.json", "tsconfig.electron.json", "package.json"]

[tasks."text-snapshot"]
description = "Regenerate test/fixtures/parser/text-snapshot.json from the committed test fixture. Run ONLY when the parser intentionally changes text output (e.g. source.html fixture is updated). Otherwise drift = bug — investigate root cause."
run = "pnpm exec tsx scripts/gen-text-snapshot.ts"
sources = ["src/parser/**/*.ts", "src/corpus/**/*.ts", "src/storage/**/*.ts", "test/fixtures/sf/source.html", "test/fixtures/sf/jurisdiction.json", "scripts/gen-text-snapshot.ts"]
outputs = ["test/fixtures/parser/text-snapshot.json"]

[tasks.dev]
description = "Run the Electron app in dev with HMR (electron-vite)"
run = "pnpm exec electron-vite dev"

[tasks."build:app"]
description = "Build main + preload + renderer bundles into out/"
run = "pnpm exec electron-vite build"
sources = ["src/**/*", "electron/**/*", "electron.vite.config.ts", "package.json"]
outputs = ["out/**/*"]

[tasks.package]
description = "Local-only unsigned dir build via electron-builder. Signing + notarization belong to feat/build-pipeline."
run = """
pnpm exec electron-vite build
pnpm exec electron-builder --dir
"""
sources = ["src/**/*", "electron/**/*", "electron.vite.config.ts", "electron-builder.yml", "package.json"]
outputs = ["dist-electron/**/*"]

[tasks.lint]
description = "Lint with biome"
run = "pnpm exec biome lint ."
sources = ["src/**/*.ts", "src/**/*.tsx", "test/**/*.ts", "test/**/*.tsx", "electron/**/*.ts", "biome.json"]

[tasks.format]
description = "Format with biome (write)"
run = "pnpm exec biome format --write ."

[tasks."format:check"]
description = "Check formatting without writing"
run = "pnpm exec biome format ."
sources = ["src/**/*.ts", "src/**/*.tsx", "test/**/*.ts", "test/**/*.tsx", "electron/**/*.ts", "biome.json"]

[tasks.test]
description = "Run vitest test suite"
run = "pnpm exec vitest run"
sources = ["src/**/*.ts", "src/**/*.tsx", "test/**/*.ts", "test/**/*.tsx", "electron/**/*.ts", "vitest.config.ts"]

[tasks."test:e2e"]
description = "Run Playwright Electron E2E (smoke + posture). Builds out/ first because Playwright launches the built artifact, not the dev server."
run = """
pnpm exec electron-vite build
pnpm exec playwright test
"""
sources = ["src/**/*", "electron/**/*", "test/e2e/**/*", "playwright.config.ts", "electron.vite.config.ts", "package.json"]

[tasks.build]
description = "Compile src/ to dist/ via tsc (emits .js + .d.ts + sourcemaps)"
run = "pnpm exec tsc --project tsconfig.build.json"
sources = ["src/**/*.ts", "tsconfig.json", "tsconfig.build.json", "package.json"]
outputs = ["dist/**/*"]
